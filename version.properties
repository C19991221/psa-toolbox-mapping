# 版本号定义（唯一真源）。
#
# marketing = 对外宣传的「大版本」，只在有功能变化时才动（例如 5.3.16 → 5.4.0）。
# build     = 构建号，每次出包都 +1（哪怕只改了一个界面文案），同时用作 versionCode。
#
# versionName 由 build.gradle.kts 拼成：工具箱开发版<marketing> (build <build>)
# versionCode = build（Android 要求单调递增，升级安装才不会被拒）
#
# ⚠ 出包后必须用 ota/publish_ota.py 发布，它会自动读这里的值写 lasted_version，
#   两边必须逐字符一致（VersionUtils 是字符串相等比较，不一致会让设备永远「有新版本」）。
#
# 用  python bump_build.py           只 +build（UI 微调、修 bug）
#     python bump_build.py --marketing 5.4.0   同时换大版本并把 build 归 1

marketing=5.3.16
build=31
